<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe SOC Pink Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#05010a;
  color:#fbcfe8;
  transition:0.3s;
}

body.light{
  background:#fff0f6;
  color:#4a044e;
}

#loginScreen{
  position:fixed;
  inset:0;
  background:#05010a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loginBox{
  width:340px;
  padding:24px;
  border-radius:14px;
  border:1px solid #3b0a2a;
  background:#120012;
}

.loginBox h2{
  text-align:center;
  color:#ff4da6;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a0010;
  border:1px solid #3b0a2a;
  color:#fbcfe8;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:11px;
  margin-top:10px;
  background:linear-gradient(90deg,#ff4da6,#ff1f8f);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  color:white;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#120012;
  border-bottom:1px solid #3b0a2a;
}

.logo{
  color:#ff4da6;
  font-weight:700;
}

.topButtons{
  display:flex;
  gap:10px;
  align-items:center;
}

.circleBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #ff4da6;
  background:#1a0010;
  color:#ff4da6;
  cursor:pointer;
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:14px;
  padding:14px;
}

.panel{
  background:#120012;
  border:1px solid #3b0a2a;
  border-radius:14px;
  padding:14px;
}

h2{
  font-size:12px;
  color:#ff4da6;
  text-transform:uppercase;
  margin-top:0;
}

#log{
  height:220px;
  overflow-y:auto;
  font-family:monospace;
  font-size:12px;
}

.bar{
  height:10px;
  background:#2a001a;
  border-radius:999px;
  overflow:hidden;
  margin:8px 0 12px;
}

.fill{
  height:100%;
  width:0%;
  background:#ff4da6;
  transition:0.4s;
}

canvas{
  width:100%;
  height:240px;
  background:#1a0010;
  border-radius:10px;
  border:1px solid #3b0a2a;
}

#chatBox{
  height:200px;
  overflow-y:auto;
  background:#1a0010;
  border-radius:10px;
  padding:10px;
}

.user{color:#ffb6d9;}
.bot{color:white;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>SOC LOGIN</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Enter Dashboard</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">

  <div class="logo">CyberSafe SOC Dashboard</div>

  <div class="topButtons">

    <div class="status">🟢 LIVE</div>

    <button class="circleBtn" onclick="window.location.href='attack-map.html'">🌍</button>
    <button class="circleBtn" onclick="toggleTheme()">🌓</button>
    <button class="circleBtn" onclick="logout()">🚪</button>

  </div>
</div>

<!-- DASHBOARD -->
<div class="container">

  <div class="panel">
    <h2>Live Risk Stream</h2>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <h2>Security Scanner</h2>

    <input id="passwordInput" placeholder="Password">
    <button onclick="scanPassword()">Password Scan</button>

    <input id="emailInput" placeholder="Email text">
    <button onclick="scanEmail()">Phishing Scan</button>
  </div>

  <div class="panel">
    <h2>Incident Log</h2>
    <div id="log"></div>
  </div>

  <div class="panel">
    <h2>Risk Metrics</h2>

    <div>Password Risk</div>
    <div class="bar"><div id="pw" class="fill"></div></div>

    <div>Phishing Risk</div>
    <div class="bar"><div id="ph" class="fill"></div></div>

  </div>

  <div class="panel">
    <h2>AI Analyst</h2>

    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Ask AI...">
    <button onclick="sendChat()">Send</button>

  </div>

</div>

<script>

let loggedIn=false;

/* LOG SYSTEM */
function log(msg){
  const el=document.getElementById("log");
  const t=new Date().toLocaleTimeString();
  el.innerHTML=`[${t}] ${msg}<br>` + el.innerHTML;
}

/* LOGIN */
function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;

  if(u==="hasini.p77" && p==="Hasini9!"){
    document.getElementById("loginScreen").style.display="none";
    loggedIn=true;
    log("User authenticated");
  } else {
    alert("ACCESS DENIED");
  }
}

/* LOGOUT */
function logout(){
  document.getElementById("loginScreen").style.display="flex";
  loggedIn=false;
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
  log("Theme toggled");
}

/* SCANS */
function scanPassword(){
  let pw=document.getElementById("passwordInput").value;
  document.getElementById("pw").style.width=pw.length>8?"20%":"70%";
  log("Password scan executed");
}

function scanEmail(){
  let e=document.getElementById("emailInput").value.toLowerCase();
  document.getElementById("ph").style.width=e.includes("urgent")?"80%":"20%";
  log("Email phishing scan executed");
}

/* CHAT */
function sendChat(){
  const input=document.getElementById("chatInput");
  const chat=document.getElementById("chatBox");

  let msg=input.value.toLowerCase();
  if(!msg) return;

  let res="Monitoring system activity.";
  if(msg.includes("phishing")) res="Phishing detected patterns.";
  if(msg.includes("password")) res="Use MFA.";

  chat.innerHTML+=`<div class="user">You: ${msg}</div><div class="bot">AI: ${res}</div>`;
  input.value="";
}

</script>

</body>
</html>

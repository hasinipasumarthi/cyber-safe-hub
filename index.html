<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe Hub Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }

    header {
      padding: 40px;
      text-align: center;
      background: radial-gradient(circle at top, #1e3a8a, #0b1220);
    }

    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 40px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .card h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 CyberSafe Hub Pro</h1>
  <p>Interactive Cybersecurity Awareness Dashboard</p>
</header>

<div class="container">

  <!-- PASSWORD TOOL -->
  <div class="card">
    <h2>🔑 Password Checker</h2>
    <input type="text" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Analyze</button>
    <div class="result" id="pwResult"></div>
  </div>

  <!-- PHISHING CHECKER -->
  <div class="card">
    <h2>🎣 Phishing Checker</h2>
    <input type="text" id="emailText" placeholder="Paste email text">
    <button onclick="checkPhishing()">Scan</button>
    <div class="result" id="phishResult"></div>
  </div>

  <!-- SECURITY TIPS -->
  <div class="card">
    <h2>💡 Security Tips</h2>
    <p>✔ Use unique passwords for every account</p>
    <p>✔ Never click suspicious links</p>
    <p>✔ Enable 2-factor authentication</p>
    <p>✔ Watch for urgent/scam language in emails</p>
  </div>

</div>

<script>
function checkPassword() {
  const pw = document.getElementById("password").value;
  const out = document.getElementById("pwResult");

  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  if (!pw) return out.textContent = "";

  if (score <= 1) {
    out.textContent = "Weak Password ❌";
    out.style.color = "#ef4444";
  } else if (score <= 3) {
    out.textContent = "Medium Password ⚠️";
    out.style.color = "#f59e0b";
  } else {
    out.textContent = "Strong Password ✅";
    out.style.color = "#22c55e";
  }
}

function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();
  const out = document.getElementById("phishResult");

  let score = 0;

  if (text.includes("urgent")) score++;
  if (text.includes("password")) score++;
  if (text.includes("click here")) score++;
  if (text.includes("verify")) score++;

  if (!text) return out.textContent = "";

  if (score >= 2) {
    out.textContent = "⚠️ Likely Phishing Email";
    out.style.color = "#ef4444";
  } else {
    out.textContent = "✔ Looks Safe (but still be careful)";
    out.style.color = "#22c55e";
  }
}
</script>

</body>
</html>

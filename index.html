<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe Hub Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }

    header {
      padding: 30px;
      text-align: center;
      background: radial-gradient(circle at top, #1e3a8a, #0b1220);
    }

    h1 {
      margin: 0;
      color: #38bdf8;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .card h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
    }

    /* INCIDENT LOG */
    #logPanel {
      height: 250px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 13px;
      border: 1px solid #1f2937;
    }

    .log-entry {
      margin-bottom: 6px;
      color: #38bdf8;
    }

    .danger {
      color: #ef4444;
    }

    .safe {
      color: #22c55e;
    }

  </style>
</head>

<body>

<header>
  <h1>🔐 CyberSafe Hub Pro</h1>
</header>

<div class="container">

  <!-- PASSWORD -->
  <div class="card">
    <h2>🔑 Password Checker</h2>
    <input type="text" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Analyze</button>
    <div class="result" id="pwResult"></div>
  </div>

  <!-- PHISHING -->
  <div class="card">
    <h2>🎣 Phishing Checker</h2>
    <input type="text" id="emailText" placeholder="Paste email text">
    <button onclick="checkPhishing()">Scan</button>
    <div class="result" id="phishResult"></div>
  </div>

  <!-- INCIDENT LOG -->
  <div class="card">
    <h2>📋 Incident Log</h2>
    <div id="logPanel"></div>
  </div>

</div>

<script>

function addLog(message, type="info") {
  const log = document.getElementById("logPanel");

  const time = new Date().toLocaleTimeString();

  const entry = document.createElement("div");
  entry.classList.add("log-entry");

  if (type === "danger") entry.classList.add("danger");
  if (type === "safe") entry.classList.add("safe");

  entry.textContent = `[${time}] ${message}`;

  log.prepend(entry);
}

/* PASSWORD CHECK */
function checkPassword() {
  const pw = document.getElementById("password").value;
  const out = document.getElementById("pwResult");

  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  if (!pw) return;

  if (score <= 1) {
    out.textContent = "Weak ❌";
    addLog("Weak password detected", "danger");
  } else if (score <= 3) {
    out.textContent = "Medium ⚠️";
    addLog("Medium strength password entered", "info");
  } else {
    out.textContent = "Strong ✅";
    addLog("Strong password created", "safe");
  }
}

/* PHISHING CHECK */
function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();
  const out = document.getElementById("phishResult");

  let score = 0;
  if (text.includes("urgent")) score++;
  if (text.includes("password")) score++;
  if (text.includes("click here")) score++;
  if (text.includes("verify")) score++;

  if (!text) return;

  if (score >= 2) {
    out.textContent = "⚠️ Phishing Likely";
    addLog("Phishing email detected", "danger");
  } else {
    out.textContent = "✔ Safe";
    addLog("Email scanned: safe", "safe");
  }
}

/* LOGIN EVENT (optional demo log) */
addLog("System initialized", "safe");

</script>

</body>
</html>

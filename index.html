<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe SOC Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #050b18;
  color: #d1d5db;
}

/* LOGIN SCREEN */
#loginScreen {
  position: fixed;
  inset: 0;
  background: #050b18;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.loginBox {
  width: 320px;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: #0b1220;
}

.loginBox h2 {
  color: #38bdf8;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #050b18;
  border: 1px solid #1f2937;
  color: white;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  background: #0b1220;
  border-bottom: 1px solid #1f2937;
}

.logo {
  color: #38bdf8;
  font-weight: bold;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

.panel {
  background: #0b1220;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
}

h2 {
  font-size: 12px;
  color: #38bdf8;
  text-transform: uppercase;
  margin-top: 0;
}

/* LOG */
#log {
  height: 220px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
}

/* BARS */
.bar {
  height: 10px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin: 6px 0;
}

.fill {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: 0.3s;
}

/* ALERT */
.alert {
  margin-top: 10px;
  padding: 8px;
  border-radius: 6px;
}

.high { background: rgba(239,68,68,0.15); border-left: 3px solid #ef4444; }
.med { background: rgba(245,158,11,0.15); border-left: 3px solid #f59e0b; }
.low { background: rgba(34,197,94,0.15); border-left: 3px solid #22c55e; }

canvas {
  width: 100%;
  height: 220px;
  background: #050b18;
  border-radius: 8px;
  border: 1px solid #1f2937;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>SOC LOGIN</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Enter Dashboard</button>

    <div id="loginMsg" style="margin-top:10px;font-size:12px;"></div>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">🔐 CyberSafe SOC Dashboard</div>
  <div>🟢 LIVE</div>
</div>

<div class="container">

<!-- GRAPH -->
<div class="panel">
  <h2>Live Risk Stream</h2>
  <canvas id="chart"></canvas>
</div>

<!-- SCANNER -->
<div class="panel">
  <h2>Security Scanner</h2>

  <input id="passwordInput" placeholder="Password">
  <button onclick="scanPassword()">Password Scan</button>

  <input id="emailInput" placeholder="Email text">
  <button onclick="scanEmail()">Phishing Scan</button>

  <button onclick="generateScore()">Generate SOC Score</button>

  <div id="score"></div>
</div>

<!-- LOG -->
<div class="panel">
  <h2>Incident Log</h2>
  <div id="log"></div>
</div>

<!-- RISKS -->
<div class="panel">
  <h2>Risk Metrics</h2>

  <div>Password Risk</div>
  <div class="bar"><div id="pw" class="fill"></div></div>

  <div>Phishing Risk</div>
  <div class="bar"><div id="ph" class="fill"></div></div>

  <div>System Risk</div>
  <div class="bar"><div id="sys" class="fill"></div></div>

  <div id="alert"></div>
</div>

<!-- AI -->
<div class="panel">
  <h2>AI SOC Analyst</h2>
  <button onclick="generateAI()">Generate Report</button>
  <pre id="ai"></pre>
</div>

</div>

<script>

let loggedIn = false;

/* LOGIN FUNCTION */
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (u === "hasini.p77" && p === "Hasini9!") {
    loggedIn = true;
    document.getElementById("loginScreen").style.display = "none";
    log("User authenticated: " + u);
  } else {
    document.getElementById("loginMsg").innerText =
      "ACCESS DENIED ❌ Invalid credentials";
  }
}

/* LOG */
function log(msg) {
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

/* GRAPH */
const c = document.getElementById("chart");
const ctx = c.getContext("2d");
c.width = c.offsetWidth;
c.height = 220;

let data = Array(60).fill(30);

function draw() {
  ctx.clearRect(0,0,c.width,c.height);
  ctx.beginPath();
  ctx.strokeStyle = "#38bdf8";

  for (let i=0;i<data.length;i++) {
    let x = (i/data.length)*c.width;
    let y = c.height - (data[i]/100)*c.height;

    if (i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

setInterval(() => {
  let last = data[data.length-1];
  let next = Math.max(5, Math.min(95, last + (Math.random()-0.5)*10));
  data.push(next);
  data.shift();
  draw();
},1000);

/* PASSWORD */
function scanPassword() {
  let pw = document.getElementById("passwordInput").value;

  let risk = !pw ? 80 : (pw.length < 8 ? 40 : 20);

  document.getElementById("pw").style.width = risk + "%";
  data[data.length-1] = risk;

  log("Password scan executed");
}

/* EMAIL */
function scanEmail() {
  let e = document.getElementById("emailInput").value.toLowerCase();

  let risk = 0;
  if (e.includes("urgent")) risk += 50;
  if (e.includes("click")) risk += 40;

  document.getElementById("ph").style.width = risk + "%";
  data[data.length-1] = risk;

  log("Email scan executed");
}

/* SCORE */
function generateScore() {
  let pw = document.getElementById("passwordInput").value;
  let e = document.getElementById("emailInput").value.toLowerCase();

  let pwRisk = !pw ? 80 : 30;
  let phRisk = e.includes("urgent") ? 60 : 10;

  let score = Math.round(100 - (pwRisk + phRisk)/2);

  document.getElementById("score").innerText =
    "SOC Security Score: " + score;

  updateBars(pwRisk, phRisk, 100-score);

  log("SOC score generated");
}

/* BARS */
function updateBars(pw, ph, sys) {
  document.getElementById("pw").style.width = pw + "%";
  document.getElementById("ph").style.width = ph + "%";
  document.getElementById("sys").style.width = sys + "%";

  let alert = document.getElementById("alert");

  if (sys > 60) alert.innerHTML = "<div class='alert high'>CRITICAL RISK</div>";
  else if (sys > 30) alert.innerHTML = "<div class='alert med'>MEDIUM RISK</div>";
  else alert.innerHTML = "<div class='alert low'>SYSTEM STABLE</div>";
}

/* AI */
function generateAI() {
  let pw = document.getElementById("passwordInput").value;
  let e = document.getElementById("emailInput").value;

  let issues = [];
  if (!pw || pw.length < 8) issues.push("Weak password detected");
  if (e.includes("urgent")) issues.push("Phishing indicators detected");

  document.getElementById("ai").innerText =
    "SOC ANALYST REPORT\n\n- " + (issues.join("\n- ") || "No threats detected");

  log("AI report generated");
}

draw();

</script>

</body>
</html>

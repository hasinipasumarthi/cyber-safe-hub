<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe Hub Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #0a1020;
  color: #e5e7eb;
}

/* HEADER */
header {
  padding: 15px 20px;
  background: linear-gradient(90deg, #0f172a, #1e3a8a);
  border-bottom: 1px solid #1f2937;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

h1 {
  margin: 0;
  color: #38bdf8;
  font-size: 22px;
}

/* FLOATING TERMINAL BUTTON */
.toggle-btn {
  position: fixed;
  top: 15px;
  right: 15px;

  width: 40px;
  height: 40px;

  border-radius: 50%;
  border: none;

  background: #38bdf8;
  color: black;

  font-size: 18px;
  font-weight: bold;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: 0 0 10px rgba(0,0,0,0.4);
  transition: 0.2s;
}

.toggle-btn:hover {
  background: #0ea5e9;
  transform: scale(1.1);
}

/* GRID */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "score log"
    "password phishing"
    "chart chart";
  gap: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  border: 1px solid #1f2937;
}

.card h2 {
  color: #38bdf8;
  margin-top: 0;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #1f2937;
  background: #0f172a;
  color: white;
}

button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

#logPanel {
  height: 220px;
  overflow-y: auto;
  background: #0f172a;
  padding: 10px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 12px;
}

.bar {
  height: 18px;
  background: #1f2937;
  border-radius: 6px;
  margin-bottom: 10px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  width: 0%;
  transition: 0.4s;
  background: #38bdf8;
}

/* GRID AREAS */
.card:nth-child(1) { grid-area: score; }
.card:nth-child(2) { grid-area: log; }
.card:nth-child(3) { grid-area: password; }
.card:nth-child(4) { grid-area: phishing; }
.card:nth-child(5) { grid-area: chart; }

/* TERMINAL MODE */
body.terminal {
  background: black;
  color: #00ff88;
}

body.terminal .card {
  background: black;
  border: 1px solid #00ff88;
}

body.terminal button,
body.terminal input {
  background: black;
  border: 1px solid #00ff88;
  color: #00ff88;
}

body.terminal .bar-fill {
  background: #00ff88;
}
</style>
</head>

<body>

<!-- FLOATING BUTTON -->
<button class="toggle-btn" onclick="toggleTerminal()">⟡</button>

<header>
  <div class="header-inner">
    <h1>🔐 CyberSafe Hub Pro</h1>
  </div>
</header>

<div class="container">

<!-- SCORE -->
<div class="card">
  <h2>📊 Security Score</h2>
  <button onclick="calculateScore()">Calculate Score</button>
  <div id="scoreResult"></div>
</div>

<!-- LOG -->
<div class="card">
  <h2>📋 Incident Log</h2>
  <div id="logPanel"></div>

  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportPDF()">Export PDF</button>
</div>

<!-- PASSWORD -->
<div class="card">
  <h2>🔑 Password Checker</h2>
  <input id="password" placeholder="Enter password">
  <button onclick="checkPassword()">Analyze</button>
  <div id="pwResult"></div>
</div>

<!-- PHISHING -->
<div class="card">
  <h2>🎣 Phishing Checker</h2>
  <input id="emailText" placeholder="Paste email text">
  <button onclick="checkPhishing()">Scan</button>
  <div id="phishResult"></div>
</div>

<!-- CHART -->
<div class="card">
  <h2>📈 Risk Visualization</h2>

  <p>Password Risk</p>
  <div class="bar"><div id="pwBar" class="bar-fill"></div></div>

  <p>Phishing Risk</p>
  <div class="bar"><div id="phishBar" class="bar-fill"></div></div>

  <p>Overall Risk</p>
  <div class="bar"><div id="overallBar" class="bar-fill"></div></div>
</div>

</div>

<script>

function addLog(msg) {
  const log = document.getElementById("logPanel");
  const time = new Date().toLocaleTimeString();
  const div = document.createElement("div");
  div.textContent = `[${time}] ${msg}`;
  log.prepend(div);
}

/* TERMINAL MODE */
function toggleTerminal() {
  document.body.classList.toggle("terminal");
  addLog("Terminal mode toggled");
}

/* PASSWORD */
function checkPassword() {
  const pw = document.getElementById("password").value;

  let risk = 0;
  if (!pw) risk = 80;
  else {
    if (pw.length < 8) risk += 30;
    if (!/[A-Z]/.test(pw)) risk += 20;
    if (!/[0-9]/.test(pw)) risk += 20;
    if (!/[^A-Za-z0-9]/.test(pw)) risk += 30;
  }

  document.getElementById("pwResult").textContent = "Password risk: " + risk;
  addLog("Password analyzed");

  updateChart();
}

/* PHISHING */
function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();

  let risk = 0;
  if (text.includes("urgent")) risk += 40;
  if (text.includes("click here")) risk += 40;
  if (text.includes("password")) risk += 20;

  document.getElementById("phishResult").textContent = "Phishing risk: " + risk;
  addLog("Email scanned");

  updateChart();
}

/* SCORE */
function calculateScore() {
  addLog("Security score calculated");
}

/* CHART */
function updateChart() {
  const pw = document.getElementById("password").value;
  const email = document.getElementById("emailText").value.toLowerCase();

  let pwRisk = 0;
  if (!pw) pwRisk = 80;
  else {
    if (pw.length < 8) pwRisk += 30;
    if (!/[A-Z]/.test(pw)) pwRisk += 20;
    if (!/[0-9]/.test(pw)) pwRisk += 20;
    if (!/[^A-Za-z0-9]/.test(pw)) pwRisk += 30;
  }

  let phRisk = 0;
  if (email.includes("urgent")) phRisk += 40;
  if (email.includes("click here")) phRisk += 40;
  if (email.includes("password")) phRisk += 20;

  let overall = Math.round((pwRisk + phRisk) / 2);

  document.getElementById("pwBar").style.width = pwRisk + "%";
  document.getElementById("phishBar").style.width = phRisk + "%";
  document.getElementById("overallBar").style.width = overall + "%";
}

/* EXPORT CSV */
function exportCSV() {
  const log = document.getElementById("logPanel").innerText.trim();
  if (!log) return alert("No logs to export");

  const rows = log.split("\n").map(l => `"${l}"`).join("\n");

  const blob = new Blob([rows], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "incident_log.csv";
  a.click();

  URL.revokeObjectURL(url);

  addLog("CSV exported");
}

/* EXPORT PDF */
function exportPDF() {
  const log = document.getElementById("logPanel").innerText.trim();
  if (!log) return alert("No logs to export");

  const win = window.open("", "", "width=800,height=600");

  win.document.write(`
    <h2>CyberSafe Hub Incident Report</h2>
    <pre>${log}</pre>
  `);

  win.print();

  addLog("PDF exported");
}

updateChart();

</script>

</body>
</html>

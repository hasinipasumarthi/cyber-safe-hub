<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe SOC Pink Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   BASE THEME
========================= */

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#05010a;
  color:#fbcfe8;
  transition:0.3s;
}

body.light{
  background:#fff0f6;
  color:#4a044e;
}

/* =========================
   LOGIN SCREEN
========================= */

#loginScreen{
  position:fixed;
  inset:0;
  background:#05010a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loginBox{
  width:340px;
  padding:24px;
  border-radius:14px;
  border:1px solid #3b0a2a;
  background:#120012;
}

.loginBox h2{
  text-align:center;
  color:#ff4da6;
  margin-top:0;
}

/* =========================
   INPUTS + BUTTONS
========================= */

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a0010;
  border:1px solid #3b0a2a;
  color:#fbcfe8;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:11px;
  margin-top:10px;
  background:linear-gradient(90deg,#ff4da6,#ff1f8f);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  color:white;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#120012;
  border-bottom:1px solid #3b0a2a;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-weight:700;
  font-size:18px;
  color:#ff4da6;
}

.topButtons{
  display:flex;
  gap:10px;
  align-items:center;
}

.circleBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #ff4da6;
  background:#1a0010;
  color:#ff4da6;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* =========================
   GRID
========================= */

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:14px;
  padding:14px;
}

/* =========================
   PANELS
========================= */

.panel{
  background:#120012;
  border:1px solid #3b0a2a;
  border-radius:14px;
  padding:14px;
}

h2{
  font-size:12px;
  color:#ff4da6;
  text-transform:uppercase;
  margin-top:0;
}

/* =========================
   LOG
========================= */

#log{
  height:220px;
  overflow-y:auto;
  font-family:monospace;
  font-size:12px;
}

/* =========================
   RISK BARS
========================= */

.bar{
  height:10px;
  background:#2a001a;
  border-radius:999px;
  overflow:hidden;
  margin:8px 0 12px;
}

.fill{
  height:100%;
  width:0%;
  background:#ff4da6;
  transition:0.4s;
}

/* =========================
   GRAPH
========================= */

canvas{
  width:100%;
  height:240px;
  background:#1a0010;
  border-radius:10px;
  border:1px solid #3b0a2a;
}

/* =========================
   CHAT
========================= */

#chatBox{
  height:200px;
  overflow-y:auto;
  background:#1a0010;
  border-radius:10px;
  padding:10px;
}

.user{color:#ffb6d9;}
.bot{color:white;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>SOC LOGIN</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Enter Dashboard</button>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">

  <div class="logo">CyberSafe SOC Dashboard</div>

  <div class="topButtons">

    <div class="status">🟢 LIVE</div>

    <!-- 🌍 ATTACK MAP BUTTON -->
    <button class="circleBtn" onclick="window.location.href='attack-map.html'">🌍</button>

    <button class="circleBtn" onclick="toggleTheme()">🌓</button>
    <button class="circleBtn" onclick="logout()">🚪</button>

  </div>
</div>

<!-- MAIN DASHBOARD -->
<div class="container">

  <div class="panel">
    <h2>Live Risk Stream</h2>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <h2>Security Scanner</h2>

    <input id="passwordInput" placeholder="Password">
    <button onclick="scanPassword()">Password Scan</button>

    <input id="emailInput" placeholder="Email text">
    <button onclick="scanEmail()">Phishing Scan</button>

    <div id="score"></div>
  </div>

  <div class="panel">
    <h2>Incident Log</h2>
    <div id="log"></div>
  </div>

  <div class="panel">
    <h2>Risk Metrics</h2>

    <div>Password Risk</div>
    <div class="bar"><div id="pw" class="fill"></div></div>

    <div>Phishing Risk</div>
    <div class="bar"><div id="ph" class="fill"></div></div>

  </div>

  <div class="panel">
    <h2>AI Analyst</h2>

    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Ask AI...">
    <button onclick="sendChat()">Send</button>

  </div>

</div>

<script>

/* LOGIN */
function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;

  if(u==="hasini.p77" && p==="Hasini9!"){
    document.getElementById("loginScreen").style.display="none";
  } else {
    alert("ACCESS DENIED");
  }
}

/* LOGOUT */
function logout(){
  document.getElementById("loginScreen").style.display="flex";
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* GRAPH */
const c=document.getElementById("chart");
const ctx=c.getContext("2d");

c.width=c.offsetWidth;
c.height=240;

let data=Array(60).fill(30);

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.beginPath();
  ctx.strokeStyle="#ff4da6";

  for(let i=0;i<data.length;i++){
    let x=(i/data.length)*c.width;
    let y=c.height-(data[i]/100)*c.height;

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();
}

setInterval(()=>{
  let last=data[data.length-1];
  let next=Math.max(5,Math.min(95,last+(Math.random()-0.5)*10));
  data.push(next);
  data.shift();
  draw();
},1000);

/* SCANS */
function scanPassword(){
  let pw=document.getElementById("passwordInput").value;
  document.getElementById("pw").style.width=pw.length>8?"20%":"70%";
}

function scanEmail(){
  let e=document.getElementById("emailInput").value.toLowerCase();
  document.getElementById("ph").style.width=e.includes("urgent")?"80%":"20%";
}

/* CHAT */
function sendChat(){
  const input=document.getElementById("chatInput");
  const chat=document.getElementById("chatBox");

  let msg=input.value.toLowerCase();
  if(!msg) return;

  let res="Monitoring system activity.";
  if(msg.includes("phishing")) res="Phishing detected.";
  if(msg.includes("password")) res="Use MFA.";

  chat.innerHTML+=`<div class="user">You: ${msg}</div><div class="bot">AI: ${res}</div>`;
  input.value="";
}

draw();

</script>

</body>
</html>

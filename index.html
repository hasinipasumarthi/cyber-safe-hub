<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe Hub Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
    }

    /* LOGIN PAGE */
    #loginPage {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1e3a8a, #0b1220);
    }

    .login-box {
      background: #111827;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      border: 1px solid #1f2937;
    }

    .login-box h2 {
      text-align: center;
      color: #38bdf8;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    /* DASHBOARD */
    #dashboard {
      display: none;
    }

    header {
      padding: 30px;
      text-align: center;
      background: radial-gradient(circle at top, #1e3a8a, #0b1220);
    }

    h1 {
      margin: 0;
      color: #38bdf8;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #1f2937;
    }

    .card h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
    }

    #scanLog {
      font-family: monospace;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      min-height: 120px;
      color: #38bdf8;
    }

    .logout {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 120px;
    }

  </style>
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginPage">
  <div class="login-box">
    <h2>🔐 Secure Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

  <button class="logout" onclick="logout()">Logout</button>

  <header>
    <h1>CyberSafe Hub Pro</h1>
  </header>

  <div class="container">

    <div class="card">
      <h2>🔑 Password Checker</h2>
      <input type="text" id="pwInput" placeholder="Enter password">
      <button onclick="checkPassword()">Analyze</button>
      <div class="result" id="pwResult"></div>
    </div>

    <div class="card">
      <h2>🎣 Phishing Checker</h2>
      <input type="text" id="emailText" placeholder="Paste email text">
      <button onclick="checkPhishing()">Scan</button>
      <div class="result" id="phishResult"></div>
    </div>

    <div class="card">
      <h2>🖥 Live Scan</h2>
      <div id="scanLog"></div>
    </div>

  </div>
</div>

<script>

/* LOGIN LOGIC */
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (user === "admin" && pass === "1234") {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    runScan();
  } else {
    alert("Invalid credentials");
  }
}

function logout() {
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginPage").style.display = "flex";
}

/* PASSWORD CHECK */
function checkPassword() {
  const pw = document.getElementById("pwInput").value;
  const out = document.getElementById("pwResult");

  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  if (score <= 1) out.textContent = "Weak ❌";
  else if (score <= 3) out.textContent = "Medium ⚠️";
  else out.textContent = "Strong ✅";
}

/* PHISHING CHECK */
function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();
  const out = document.getElementById("phishResult");

  let score = 0;
  if (text.includes("urgent")) score++;
  if (text.includes("password")) score++;
  if (text.includes("click here")) score++;
  if (text.includes("verify")) score++;

  if (score >= 2) out.textContent = "⚠️ Phishing Likely";
  else out.textContent = "✔ Safe";
}

/* LIVE SCAN */
const scanMessages = [
  "Logging into secure system...",
  "Scanning user permissions...",
  "Checking firewall status...",
  "Analyzing threats...",
  "System secure ✔"
];

let i = 0;

function runScan() {
  const log = document.getElementById("scanLog");
  if (!log || i >= scanMessages.length) return;

  log.innerHTML += scanMessages[i] + "<br>";
  i++;
  setTimeout(runScan, 1200);
}

</script>

</body>
</html>

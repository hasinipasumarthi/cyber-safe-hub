<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOC Security Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #050b18;
  color: #d1d5db;
}

/* TOP BAR (SOC STYLE) */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: #0b1220;
  border-bottom: 1px solid #1f2937;
}

.brand {
  color: #38bdf8;
  font-weight: 700;
}

.status {
  display: flex;
  gap: 10px;
  font-size: 12px;
}

.badge {
  padding: 4px 10px;
  border-radius: 999px;
  background: #111827;
  border: 1px solid #1f2937;
}

.badge.green { color: #22c55e; }
.badge.yellow { color: #f59e0b; }
.badge.red { color: #ef4444; }

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 15px;
  padding: 15px;
}

/* PANELS */
.panel {
  background: #0b1220;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 15px;
}

.panel h2 {
  font-size: 14px;
  color: #38bdf8;
  margin-top: 0;
  text-transform: uppercase;
}

/* INPUTS */
input {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  background: #050b18;
  border: 1px solid #1f2937;
  color: white;
  border-radius: 6px;
}

button {
  width: 100%;
  margin-top: 8px;
  padding: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}

button:hover {
  background: #0ea5e9;
}

/* LOG STREAM (SOC STYLE) */
.log {
  height: 260px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
  background: #050b18;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #1f2937;
}

/* ALERT BOX */
.alert {
  padding: 10px;
  margin-top: 10px;
  border-radius: 6px;
  border-left: 4px solid;
  font-size: 12px;
}

.high { border-color: #ef4444; background: rgba(239,68,68,0.1); }
.medium { border-color: #f59e0b; background: rgba(245,158,11,0.1); }
.low { border-color: #22c55e; background: rgba(34,197,94,0.1); }

/* BARS */
.bar {
  height: 10px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin: 6px 0 10px;
}

.fill {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: 0.3s;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">SOC Security Console</div>

  <div class="status">
    <div class="badge green">SYSTEM ONLINE</div>
    <div class="badge yellow">3 ALERTS</div>
    <div class="badge red">0 CRITICAL</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="container">

<!-- LOG STREAM -->
<div class="panel">
  <h2>Live Event Stream</h2>
  <div id="log" class="log"></div>
</div>

<!-- ANALYSIS -->
<div class="panel">
  <h2>Security Scanner</h2>

  <input id="password" placeholder="Password input">
  <button onclick="scan()">Run Scan</button>

  <input id="email" placeholder="Email text">
  <button onclick="phish()">Check Email</button>

  <button onclick="generate()">Generate Score</button>

  <div id="score"></div>
</div>

<!-- RISK -->
<div class="panel">
  <h2>Risk Overview</h2>

  <div>Password Risk</div>
  <div class="bar"><div id="pw" class="fill"></div></div>

  <div>Phishing Risk</div>
  <div class="bar"><div id="ph" class="fill"></div></div>

  <div>System Risk</div>
  <div class="bar"><div id="sys" class="fill"></div></div>

  <div id="alert"></div>
</div>

</div>

<script>

function log(msg) {
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

/* PASSWORD */
function scan() {
  const pw = document.getElementById("password").value;

  let risk = !pw ? 80 :
    (pw.length < 8 ? 30 : 0) +
    (!/[A-Z]/.test(pw) ? 20 : 0) +
    (!/[0-9]/.test(pw) ? 20 : 0);

  document.getElementById("pw").style.width = risk + "%";

  log("Password scan completed");
}

/* PHISHING */
function phish() {
  const e = document.getElementById("email").value.toLowerCase();

  let risk = 0;
  if (e.includes("urgent")) risk += 40;
  if (e.includes("click")) risk += 40;

  document.getElementById("ph").style.width = risk + "%";

  log("Email analyzed for phishing");
}

/* SCORE + ALERT ENGINE */
function generate() {
  const pw = document.getElementById("password").value;
  const e = document.getElementById("email").value.toLowerCase();

  let pwRisk = (!pw ? 80 : 40);
  let phRisk = (e.includes("urgent") ? 60 : 10);

  let score = Math.round(100 - (pwRisk + phRisk) / 2);

  document.getElementById("sys").style.width = (100 - score) + "%";

  document.getElementById("score").innerHTML =
    "Security Score: " + score;

  let alertBox = document.getElementById("alert");

  if (score < 40) {
    alertBox.innerHTML = "<div class='alert high'>HIGH RISK INCIDENT DETECTED</div>";
  } else if (score < 70) {
    alertBox.innerHTML = "<div class='alert medium'>Suspicious activity detected</div>";
  } else {
    alertBox.innerHTML = "<div class='alert low'>System stable</div>";
  }

  log("SOC score generated");
}

</script>

</body>
</html>

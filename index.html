<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe Hub Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #0a1020;
  color: #e5e7eb;
}

/* HEADER */
header {
  padding: 25px;
  text-align: center;
  background: linear-gradient(90deg, #0f172a, #1e3a8a);
  border-bottom: 1px solid #1f2937;
}

h1 {
  margin: 0;
  color: #38bdf8;
}

/* GRID LAYOUT */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px;

  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "score log"
    "password phishing";
  gap: 20px;
}

/* CARD STYLE */
.card {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  border: 1px solid #1f2937;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);
}

.card h2 {
  color: #38bdf8;
  margin-top: 0;
}

/* ASSIGN AREAS */
.card:nth-child(1) { grid-area: password; }
.card:nth-child(2) { grid-area: phishing; }
.card:nth-child(3) { grid-area: score; }
.card:nth-child(4) { grid-area: log; }

/* INPUTS */
input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #1f2937;
  background: #0f172a;
  color: white;
}

/* BUTTONS */
button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

/* INCIDENT LOG */
#logPanel {
  height: 220px;
  overflow-y: auto;
  background: #0f172a;
  padding: 10px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 12px;
  border: 1px solid #1f2937;
}

/* MOBILE FIX */
@media (max-width: 800px) {
  .container {
    grid-template-columns: 1fr;
    grid-template-areas:
      "score"
      "log"
      "password"
      "phishing";
  }
}
  </style>
</head>

<body>

<header>
  <h1>🔐 CyberSafe Hub Pro</h1>
  <button class="toggle-btn" onclick="toggleTerminal()">Terminal Mode</button>
</header>

<div class="container">

  <div class="card">
    <h2>🔑 Password Checker</h2>
    <input type="text" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Analyze</button>
    <div class="result" id="pwResult"></div>
  </div>

  <div class="card">
    <h2>🎣 Phishing Checker</h2>
    <input type="text" id="emailText" placeholder="Paste email text">
    <button onclick="checkPhishing()">Scan</button>
    <div class="result" id="phishResult"></div>
  </div>

  <div class="card">
    <h2>📊 Security Score</h2>
    <button onclick="calculateScore()">Calculate Score</button>
    <div class="result" id="scoreResult"></div>
  </div>

  <div class="card">
    <h2>📋 Incident Log</h2>
    <div id="logPanel"></div>
  </div>

</div>

<script>

function addLog(message, type="info") {
  const log = document.getElementById("logPanel");
  const time = new Date().toLocaleTimeString();

  const entry = document.createElement("div");
  entry.textContent = `[${time}] ${message}`;
  log.prepend(entry);
}

/* TERMINAL TOGGLE */
function toggleTerminal() {
  document.body.classList.toggle("terminal");
  addLog("UI mode switched (terminal toggle)");
}

/* PASSWORD */
function checkPassword() {
  const pw = document.getElementById("password").value;
  const out = document.getElementById("pwResult");

  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  if (!pw) return;

  if (score <= 1) {
    out.textContent = "Weak ❌";
    addLog("Weak password detected");
  } else if (score <= 3) {
    out.textContent = "Medium ⚠️";
    addLog("Medium password entered");
  } else {
    out.textContent = "Strong ✅";
    addLog("Strong password created");
  }
}

/* PHISHING */
function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();
  const out = document.getElementById("phishResult");

  let score = 0;
  if (text.includes("urgent")) score++;
  if (text.includes("password")) score++;
  if (text.includes("click here")) score++;
  if (text.includes("verify")) score++;

  if (!text) return;

  if (score >= 2) {
    out.textContent = "⚠️ Phishing Likely";
    addLog("Phishing email detected");
  } else {
    out.textContent = "✔ Safe";
    addLog("Email scanned safe");
  }
}

/* SCORE */
function calculateScore() {
  const pw = document.getElementById("password").value;
  const email = document.getElementById("emailText")?.value?.toLowerCase() || "";

  let score = 100;

  if (!pw || pw.length < 8) score -= 30;
  if (!/[A-Z]/.test(pw)) score -= 10;
  if (!/[0-9]/.test(pw)) score -= 10;
  if (!/[^A-Za-z0-9]/.test(pw)) score -= 10;

  if (email.includes("urgent")) score -= 20;
  if (email.includes("click here")) score -= 20;

  let msg = `Security Score: ${score}`;

  if (score >= 80) {
    msg += " (Secure)";
  } else if (score >= 50) {
    msg += " (Medium Risk)";
  } else {
    msg += " (High Risk)";
  }

  document.getElementById("scoreResult").textContent = msg;
  addLog(`Security score calculated: ${score}`);
}

</script>

</body>
</html>

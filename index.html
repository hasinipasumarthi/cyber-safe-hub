<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOC Live Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #050b18;
  color: #d1d5db;
}

/* TOP BAR */
.topbar {
  padding: 12px 20px;
  background: #0b1220;
  border-bottom: 1px solid #1f2937;
  display: flex;
  justify-content: space-between;
}

.brand {
  color: #38bdf8;
  font-weight: bold;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

.panel {
  background: #0b1220;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
}

h2 {
  font-size: 13px;
  color: #38bdf8;
  margin-top: 0;
  text-transform: uppercase;
}

/* INPUTS */
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: 1px solid #1f2937;
  background: #050b18;
  color: white;
}

button {
  background: #38bdf8;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

/* LOG */
#log {
  height: 220px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
}

/* GRAPH */
canvas {
  width: 100%;
  height: 220px;
  background: #050b18;
  border-radius: 8px;
  border: 1px solid #1f2937;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">SOC Live Monitoring Console</div>
  <div>🟢 LIVE</div>
</div>

<div class="container">

<!-- LIVE GRAPH -->
<div class="panel">
  <h2>📈 Real-Time Security Risk</h2>
  <canvas id="chart"></canvas>
</div>

<!-- CONTROLS -->
<div class="panel">
  <h2>Security Scanner</h2>

  <input id="password" placeholder="Password">
  <button onclick="scan()">Scan Password</button>

  <input id="email" placeholder="Email text">
  <button onclick="scanEmail()">Scan Email</button>

  <button onclick="addRandomEvent()">Simulate Event</button>
</div>

<!-- LOG -->
<div class="panel">
  <h2>Event Stream</h2>
  <div id="log"></div>
</div>

</div>

<script>

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = 220;

let data = Array(50).fill(30);

/* LOG */
function log(msg) {
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

/* UPDATE GRAPH */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2;

  for (let i = 0; i < data.length; i++) {
    let x = (i / data.length) * canvas.width;
    let y = canvas.height - (data[i] / 100) * canvas.height;

    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }

  ctx.stroke();
}

/* LIVE UPDATE LOOP */
setInterval(() => {
  let last = data[data.length - 1];

  // small random movement like real SOC telemetry
  let change = (Math.random() - 0.5) * 10;
  let next = Math.max(5, Math.min(95, last + change));

  data.push(next);
  data.shift();

  draw();
}, 1000);

/* SCANS */
function scan() {
  const pw = document.getElementById("password").value;

  let risk = !pw ? 80 :
    (pw.length < 8 ? 30 : 0) +
    (!/[A-Z]/.test(pw) ? 20 : 0);

  data[data.length - 1] = risk;

  log("Password scan executed");
}

function scanEmail() {
  const e = document.getElementById("email").value.toLowerCase();

  let risk = 0;
  if (e.includes("urgent")) risk += 40;
  if (e.includes("click")) risk += 40;

  data[data.length - 1] = risk;

  log("Email scan executed");
}

/* RANDOM SOC EVENT */
function addRandomEvent() {
  let eventRisk = Math.floor(Math.random() * 100);
  data[data.length - 1] = eventRisk;

  log("Simulated security event detected");
}

draw();

</script>

</body>
</html>

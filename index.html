<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe SOC Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #050b18;
  color: #d1d5db;
  transition: 0.3s;
}

/* LIGHT MODE */
body.light {
  background: #f5f7fb;
  color: #0f172a;
}

body.light .panel,
body.light .topbar {
  background: white;
  border-color: #e2e8f0;
}

body.light canvas {
  background: white;
}

/* LOGIN */
#loginScreen {
  position: fixed;
  inset: 0;
  background: #050b18;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.loginBox {
  width: 320px;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #1f2937;
  background: #0b1220;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #050b18;
  border: 1px solid #1f2937;
  color: white;
  border-radius: 6px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: #0b1220;
  border-bottom: 1px solid #1f2937;
}

/* THEME BUTTON (SMALL CIRCLE) */
.themeBtn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid #1f2937;
  background: #050b18;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

.panel {
  background: #0b1220;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
}

h2 {
  font-size: 12px;
  color: #38bdf8;
  text-transform: uppercase;
  margin-top: 0;
}

/* LOG */
#log {
  height: 220px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
}

/* BARS */
.bar {
  height: 10px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin: 6px 0;
}

.fill {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: 0.3s;
}

/* ALERT */
.alert {
  margin-top: 10px;
  padding: 8px;
  border-radius: 6px;
}

.high { background: rgba(239,68,68,0.15); border-left: 3px solid #ef4444; }
.med { background: rgba(245,158,11,0.15); border-left: 3px solid #f59e0b; }
.low { background: rgba(34,197,94,0.15); border-left: 3px solid #22c55e; }

canvas {
  width: 100%;
  height: 220px;
  background: #050b18;
  border-radius: 8px;
  border: 1px solid #1f2937;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>SOC LOGIN</h2>

    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Enter Dashboard</button>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">🔐 CyberSafe SOC Dashboard</div>

  <!-- THEME TOGGLE BUTTON -->
  <button class="themeBtn" onclick="toggleTheme()">🌓</button>
</div>

<div class="container">

<!-- GRAPH -->
<div class="panel">
  <h2>Live Risk Stream</h2>
  <canvas id="chart"></canvas>
</div>

<!-- SCANNER -->
<div class="panel">
  <h2>Security Scanner</h2>

  <input id="passwordInput" placeholder="Password">
  <button onclick="scanPassword()">Password Scan</button>

  <input id="emailInput" placeholder="Email text">
  <button onclick="scanEmail()">Phishing Scan</button>

  <button onclick="generateScore()">Generate SOC Score</button>

  <div id="score"></div>
</div>

<!-- LOG -->
<div class="panel">
  <h2>Incident Log</h2>
  <div id="log"></div>
</div>

<!-- RISKS -->
<div class="panel">
  <h2>Risk Metrics</h2>

  <div>Password Risk</div>
  <div class="bar"><div id="pw" class="fill"></div></div>

  <div>Phishing Risk</div>
  <div class="bar"><div id="ph" class="fill"></div></div>

  <div>System Risk</div>
  <div class="bar"><div id="sys" class="fill"></div></div>

  <div id="alert"></div>
</div>

<!-- AI -->
<div class="panel">
  <h2>AI SOC Analyst</h2>
  <button onclick="generateAI()">Generate Report</button>
  <pre id="ai"></pre>
</div>

</div>

<script>

let loggedIn = false;

/* LOGIN */
function login() {
  const u = document.getElementById("username").value;
  const p = document.getElementById("password").value;

  if (u === "hasini.p77" && p === "Hasini9!") {
    loggedIn = true;
    document.getElementById("loginScreen").style.display = "none";
    log("User authenticated");
  } else {
    alert("ACCESS DENIED");
  }
}

/* THEME TOGGLE */
function toggleTheme() {
  document.body.classList.toggle("light");
  log("Theme toggled");
}

/* LOG */
function log(msg) {
  const el = document.getElementById("log");
  const t = new Date().toLocaleTimeString();
  el.innerHTML = `[${t}] ${msg}<br>` + el.innerHTML;
}

/* GRAPH */
const c = document.getElementById("chart");
const ctx = c.getContext("2d");
c.width = c.offsetWidth;
c.height = 220;

let data = Array(60).fill(30);

function draw() {
  ctx.clearRect(0,0,c.width,c.height);
  ctx.beginPath();
  ctx.strokeStyle = "#38bdf8";

  for (let i=0;i<data.length;i++) {
    let x = (i/data.length)*c.width;
    let y = c.height - (data[i]/100)*c.height;

    if (i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

setInterval(() => {
  let last = data[data.length-1];
  let next = Math.max(5, Math.min(95, last + (Math.random()-0.5)*10));
  data.push(next);
  data.shift();
  draw();
},1000);

/* SCANS */
function scanPassword() {
  let pw = document.getElementById("passwordInput").value;
  let risk = !pw ? 80 : (pw.length<8?40:20);
  document.getElementById("pw").style.width = risk+"%";
  data[data.length-1]=risk;
  log("Password scan");
}

function scanEmail() {
  let e = document.getElementById("emailInput").value.toLowerCase();
  let risk = (e.includes("urgent")?60:10);
  document.getElementById("ph").style.width = risk+"%";
  data[data.length-1]=risk;
  log("Email scan");
}

/* SCORE */
function generateScore() {
  let pw=document.getElementById("passwordInput").value;
  let e=document.getElementById("emailInput").value.toLowerCase();

  let pwRisk=!pw?80:30;
  let phRisk=e.includes("urgent")?60:10;

  let score=Math.round(100-(pwRisk+phRisk)/2);

  document.getElementById("score").innerText="SOC Score: "+score;

  update(pwRisk,phRisk,100-score);
  log("Score generated");
}

/* UPDATE */
function update(pw,ph,sys){
  document.getElementById("pw").style.width=pw+"%";
  document.getElementById("ph").style.width=ph+"%";
  document.getElementById("sys").style.width=sys+"%";

  let alert=document.getElementById("alert");

  if(sys>60) alert.innerHTML="<div class='alert high'>CRITICAL</div>";
  else if(sys>30) alert.innerHTML="<div class='alert med'>MEDIUM</div>";
  else alert.innerHTML="<div class='alert low'>SAFE</div>";
}

/* AI */
function generateAI(){
  let pw=document.getElementById("passwordInput").value;
  let e=document.getElementById("emailInput").value;

  let issues=[];
  if(!pw||pw.length<8)issues.push("Weak password");
  if(e.includes("urgent"))issues.push("Phishing risk");

  document.getElementById("ai").innerText=
  "REPORT\n\n- "+(issues.join("\n- ")||"No issues");

  log("AI report");
}

draw();

</script>

</body>
</html>

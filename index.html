<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe Hub Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: #0a1020;
  color: #e5e7eb;
}

/* HEADER */
header {
  padding: 15px 20px;
  background: linear-gradient(90deg, #0f172a, #1e3a8a);
  border-bottom: 1px solid #1f2937;
  text-align: center;
}

h1 {
  margin: 0;
  color: #38bdf8;
}

/* FLOAT BUTTON */
.toggle-btn {
  position: fixed;
  top: 15px;
  right: 15px;

  width: 40px;
  height: 40px;

  border-radius: 50%;
  border: none;

  background: #38bdf8;
  cursor: pointer;
  font-size: 18px;
}

/* GRID */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 25px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  border-radius: 14px;
  border: 1px solid #1f2937;
}

.card h2 {
  color: #38bdf8;
}

/* INPUT FIX */
input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

input[type="number"] {
  border: 2px solid #38bdf8;
}

/* BUTTON */
button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

/* LOG */
#logPanel {
  height: 200px;
  overflow-y: auto;
  background: #0f172a;
  padding: 10px;
  border-radius: 8px;
  font-family: monospace;
  font-size: 12px;
}

/* BARS */
.bar {
  height: 18px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 10px;
}

.bar-fill {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: 0.3s;
}

</style>
</head>

<body>

<button class="toggle-btn" onclick="toggleTerminal()">⟡</button>

<header>
  <h1>🔐 CyberSafe Hub Pro</h1>
</header>

<div class="container">

<!-- SCORE INPUT -->
<div class="card">
  <h2>📊 Security Score</h2>

  <label>Enter score (0–100)</label>
  <input id="securityScore" type="number" min="0" max="100" placeholder="Type number here">

  <button onclick="setScore()">Set Score</button>

  <div id="scoreResult"></div>
</div>

<!-- LOG -->
<div class="card">
  <h2>📋 Incident Log</h2>
  <div id="logPanel"></div>

  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportPDF()">Export PDF</button>
</div>

<!-- PASSWORD -->
<div class="card">
  <h2>🔑 Password Checker</h2>
  <input id="password" placeholder="Enter password">
  <button onclick="checkPassword()">Analyze</button>
  <div id="pwResult"></div>
</div>

<!-- PHISHING -->
<div class="card">
  <h2>🎣 Phishing Checker</h2>
  <input id="emailText" placeholder="Paste email text">
  <button onclick="checkPhishing()">Scan</button>
  <div id="phishResult"></div>
</div>

<!-- CHART -->
<div class="card">
  <h2>📈 Risk Visualization</h2>

  <p>Password Risk</p>
  <div class="bar"><div id="pwBar" class="bar-fill"></div></div>

  <p>Phishing Risk</p>
  <div class="bar"><div id="phishBar" class="bar-fill"></div></div>

  <p>Overall Risk</p>
  <div class="bar"><div id="overallBar" class="bar-fill"></div></div>
</div>

</div>

<script>

function addLog(msg) {
  const log = document.getElementById("logPanel");
  const time = new Date().toLocaleTimeString();
  log.innerHTML = `[${time}] ${msg}<br>` + log.innerHTML;
}

/* SCORE */
function setScore() {
  const score = Number(document.getElementById("securityScore").value);

  if (isNaN(score) || score < 0 || score > 100) {
    alert("Enter 0–100");
    return;
  }

  document.getElementById("scoreResult").innerText =
    "Security Score: " + score;

  addLog("Score set: " + score);

  updateChart(score);
}

/* PASSWORD */
function checkPassword() {
  const pw = document.getElementById("password").value;

  let risk = 0;
  if (!pw) risk = 80;
  else {
    if (pw.length < 8) risk += 30;
    if (!/[A-Z]/.test(pw)) risk += 20;
    if (!/[0-9]/.test(pw)) risk += 20;
    if (!/[^A-Za-z0-9]/.test(pw)) risk += 30;
  }

  document.getElementById("pwResult").innerText = "Password risk: " + risk;
  addLog("Password checked");

  updateChart();
}

/* PHISHING */
function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();

  let risk = 0;
  if (text.includes("urgent")) risk += 40;
  if (text.includes("click here")) risk += 40;
  if (text.includes("password")) risk += 20;

  document.getElementById("phishResult").innerText = "Phishing risk: " + risk;
  addLog("Email scanned");

  updateChart();
}

/* CHART */
function updateChart(score = 50) {

  const pw = document.getElementById("password").value;
  const email = document.getElementById("emailText").value.toLowerCase();

  let pwRisk = !pw ? 80 :
    (pw.length < 8 ? 30 : 0) +
    (!/[A-Z]/.test(pw) ? 20 : 0) +
    (!/[0-9]/.test(pw) ? 20 : 0) +
    (!/[^A-Za-z0-9]/.test(pw) ? 30 : 0);

  let phRisk = 0;
  if (email.includes("urgent")) phRisk += 40;
  if (email.includes("click here")) phRisk += 40;
  if (email.includes("password")) phRisk += 20;

  let overall = Math.round((pwRisk + phRisk + (100 - score)) / 3);

  document.getElementById("pwBar").style.width = pwRisk + "%";
  document.getElementById("phishBar").style.width = phRisk + "%";
  document.getElementById("overallBar").style.width = overall + "%";
}

/* EXPORT CSV */
function exportCSV() {
  const log = document.getElementById("logPanel").innerText;
  if (!log) return alert("No logs");

  const blob = new Blob([log], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "incident_log.csv";
  a.click();
}

/* EXPORT PDF */
function exportPDF() {
  const log = document.getElementById("logPanel").innerText;
  if (!log) return alert("No logs");

  const win = window.open("", "", "width=800,height=600");

  win.document.write(`<h2>Incident Report</h2><pre>${log}</pre>`);
  win.print();
}

/* TERMINAL */
function toggleTerminal() {
  document.body.style.background =
    document.body.style.background === "black" ? "#0a1020" : "black";

  addLog("Terminal toggled");
}

updateChart();

</script>

</body>
</html>

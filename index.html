<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOC Cyber Dashboard Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: #050b18;
  color: #d1d5db;
}

/* TOP BAR */
.topbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  background: #0b1220;
  border-bottom: 1px solid #1f2937;
}

.brand {
  color: #38bdf8;
  font-weight: bold;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  padding: 12px;
}

/* PANELS */
.panel {
  background: #0b1220;
  border: 1px solid #1f2937;
  border-radius: 10px;
  padding: 12px;
}

h2 {
  font-size: 13px;
  color: #38bdf8;
  margin-top: 0;
  text-transform: uppercase;
}

/* INPUTS */
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 6px;
  border: 1px solid #1f2937;
  background: #050b18;
  color: white;
}

button {
  background: #38bdf8;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #0ea5e9;
}

/* LOG */
#log {
  height: 220px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
}

/* BARS */
.bar {
  height: 10px;
  background: #1f2937;
  border-radius: 6px;
  overflow: hidden;
  margin: 6px 0 10px;
}

.fill {
  height: 100%;
  width: 0%;
  background: #38bdf8;
  transition: 0.3s;
}

/* GRAPH */
canvas {
  width: 100%;
  height: 220px;
  background: #050b18;
  border-radius: 8px;
  border: 1px solid #1f2937;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">SOC Security Dashboard</div>
  <div>🟢 LIVE MONITORING</div>
</div>

<div class="container">

<!-- GRAPH -->
<div class="panel">
  <h2>📈 Real-Time Risk Graph</h2>
  <canvas id="chart"></canvas>
</div>

<!-- CONTROLS -->
<div class="panel">
  <h2>Security Scanner</h2>

  <input id="password" placeholder="Password">
  <button onclick="checkPassword()">Scan Password</button>

  <input id="email" placeholder="Email text">
  <button onclick="checkPhishing()">Scan Email</button>

  <button onclick="generateScore()">Generate Security Score</button>

  <div id="score"></div>
</div>

<!-- LOG -->
<div class="panel">
  <h2>Event Log</h2>
  <div id="log"></div>
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="exportPDF()">Export PDF</button>
</div>

<!-- RISK BARS -->
<div class="panel">
  <h2>Risk Metrics</h2>

  <div>Password Risk</div>
  <div class="bar"><div id="pw" class="fill"></div></div>

  <div>Phishing Risk</div>
  <div class="bar"><div id="ph" class="fill"></div></div>

  <div>System Risk</div>
  <div class="bar"><div id="sys" class="fill"></div></div>

  <div id="alert"></div>
</div>

<!-- AI SUMMARY -->
<div class="panel">
  <h2>🧠 AI Incident Summary</h2>
  <button onclick="generateSummary()">Generate Summary</button>
  <pre id="aiSummary"></pre>
</div>

</div>

<script>

/* LOG */
function log(msg) {
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.innerHTML = `[${time}] ${msg}<br>` + el.innerHTML;
}

/* GRAPH SETUP */
const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
canvas.width = canvas.offsetWidth;
canvas.height = 220;

let data = Array(60).fill(30);

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.beginPath();
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 2;

  for (let i=0;i<data.length;i++) {
    let x = (i/data.length)*canvas.width;
    let y = canvas.height - (data[i]/100)*canvas.height;

    if (i==0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  }

  ctx.stroke();
}

/* LIVE STREAM */
setInterval(() => {
  let last = data[data.length-1];
  let change = (Math.random()-0.5)*12;
  let next = Math.max(5,Math.min(95,last+change));

  data.push(next);
  data.shift();

  draw();
},1000);

/* PASSWORD */
function checkPassword() {
  const pw = document.getElementById("password").value;

  let risk = !pw ? 80 :
    (pw.length < 8 ? 30 : 0) +
    (!/[A-Z]/.test(pw) ? 20 : 0);

  document.getElementById("pw").style.width = risk + "%";

  data[data.length-1] = risk;

  log("Password scan executed");
}

/* PHISHING */
function checkPhishing() {
  const e = document.getElementById("email").value.toLowerCase();

  let risk = 0;
  if (e.includes("urgent")) risk += 40;
  if (e.includes("click")) risk += 40;

  document.getElementById("ph").style.width = risk + "%";

  data[data.length-1] = risk;

  log("Email scan executed");
}

/* SCORE ENGINE */
function generateScore() {
  const pw = document.getElementById("password").value;
  const e = document.getElementById("email").value.toLowerCase();

  let pwRisk = !pw ? 80 : 40;
  let phRisk = e.includes("urgent") ? 60 : 10;

  let score = Math.round(100 - (pwRisk + phRisk)/2);

  document.getElementById("score").innerText =
    "Security Score: " + score;

  data[data.length-1] = 100-score;

  log("Security score generated");

  updateBars(pwRisk,phRisk,100-score);
}

/* BARS */
function updateBars(pw,ph,sys) {
  document.getElementById("pw").style.width = pw + "%";
  document.getElementById("ph").style.width = ph + "%";
  document.getElementById("sys").style.width = sys + "%";

  let alert = document.getElementById("alert");

  if (sys > 60) alert.innerHTML = "🚨 HIGH RISK";
  else if (sys > 30) alert.innerHTML = "⚠️ MEDIUM RISK";
  else alert.innerHTML = "🟢 STABLE";
}

/* AI SUMMARY */
function generateSummary() {
  const pw = document.getElementById("password").value;
  const e = document.getElementById("email").value.toLowerCase();

  let issues = [];

  if (!pw || pw.length < 8) issues.push("Weak password detected");
  if (e.includes("urgent")) issues.push("Suspicious email pattern");

  document.getElementById("aiSummary").innerText =
    "INCIDENT REPORT\n\n" +
    "Findings:\n- " + (issues.join("\n- ") || "No threats detected");

  log("AI summary generated");
}

/* EXPORT */
function exportCSV() {
  const logData = document.getElementById("log").innerText;
  const blob = new Blob([logData], {type:"text/csv"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "log.csv";
  a.click();
}

function exportPDF() {
  const logData = document.getElementById("log").innerText;
  const w = window.open();
  w.document.write("<pre>"+logData+"</pre>");
  w.print();
}

draw();

</script>

</body>
</html>

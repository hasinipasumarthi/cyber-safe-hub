<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CyberSafe SOC Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#05010a;
  color:#fbcfe8;
  transition:0.3s;
}

/* LIGHT MODE */
body.light{
  background:#fff0f6;
  color:#4a044e;
}

body.light .panel,
body.light .topbar{
  background:white;
  border-color:#f9a8d4;
}

body.light canvas{
  background:white;
}

/* LOGIN */
#loginScreen{
  position:fixed;
  inset:0;
  background:#05010a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.loginBox{
  width:340px;
  padding:24px;
  border-radius:14px;
  border:1px solid #3b0a2a;
  background:#120012;
  box-shadow:0 0 25px rgba(255,77,166,0.2);
}

.loginBox h2{
  text-align:center;
  color:#ff4da6;
}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a0010;
  border:1px solid #3b0a2a;
  color:#fbcfe8;
  border-radius:8px;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:11px;
  margin-top:10px;
  background:linear-gradient(90deg,#ff4da6,#ff1f8f);
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  color:white;
}

button:hover{
  filter:brightness(1.1);
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 20px;
  background:#120012;
  border-bottom:1px solid #3b0a2a;
}

.logo{
  color:#ff4da6;
  font-weight:700;
  font-size:18px;
}

.topButtons{
  display:flex;
  gap:10px;
  align-items:center;
}

.circleBtn{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #ff4da6;
  background:#1a0010;
  color:#ff4da6;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}

/* GRID */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:14px;
  padding:14px;
}

.panel{
  background:#120012;
  border:1px solid #3b0a2a;
  border-radius:14px;
  padding:14px;
}

h2{
  font-size:12px;
  color:#ff4da6;
  text-transform:uppercase;
  letter-spacing:1px;
}

#log{
  height:220px;
  overflow-y:auto;
  font-family:monospace;
  font-size:12px;
}

.bar{
  height:10px;
  background:#2a001a;
  border-radius:999px;
  overflow:hidden;
  margin:8px 0 12px;
}

.fill{
  height:100%;
  width:0%;
  background:#ff4da6;
  transition:0.4s;
}

canvas{
  width:100%;
  height:240px;
  background:#1a0010;
  border-radius:10px;
  border:1px solid #3b0a2a;
}

#chatBox{
  height:220px;
  overflow-y:auto;
  background:#1a0010;
  border:1px solid #3b0a2a;
  border-radius:10px;
  padding:10px;
  font-size:12px;
}

.user{color:#ffb6d9;margin-bottom:8px;}
.bot{color:#ffffff;margin-bottom:14px;}

.status{
  color:#4ade80;
  font-size:13px;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBox">
    <h2>SOC LOGIN</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Enter Dashboard</button>
  </div>
</div>

<!-- TOPBAR -->
<div class="topbar">

  <div class="logo">
    CyberSafe SOC Dashboard
  </div>

  <div class="topButtons">

    <div class="status">🟢 LIVE</div>

    <!-- 🌍 ATTACK MAP BUTTON -->
    <button class="circleBtn" onclick="window.location.href='attack-map.html'">🌍</button>

    <button class="circleBtn" onclick="toggleTheme()">🌓</button>

    <button class="circleBtn" onclick="logout()">🚪</button>

  </div>

</div>

<!-- REST OF YOUR DASHBOARD (UNCHANGED FEATURES) -->
<div class="container">

  <div class="panel">
    <h2>Live Risk Stream</h2>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <h2>Security Scanner</h2>
    <input id="passwordInput" placeholder="Enter password">
    <button onclick="scanPassword()">Password Scan</button>

    <input id="emailInput" placeholder="Paste email text">
    <button onclick="scanEmail()">Phishing Scan</button>

    <button onclick="generateScore()">Generate SOC Score</button>
    <div id="score"></div>
  </div>

  <div class="panel">
    <h2>Incident Log</h2>
    <div id="log"></div>
  </div>

  <div class="panel">
    <h2>Risk Metrics</h2>

    <div>Password Risk</div>
    <div class="bar"><div id="pw" class="fill"></div></div>

    <div>Phishing Risk</div>
    <div class="bar"><div id="ph" class="fill"></div></div>

    <div>System Risk</div>
    <div class="bar"><div id="sys" class="fill"></div></div>

    <div id="alert"></div>
  </div>

  <div class="panel">
    <h2>AI SOC Analyst Chat</h2>

    <div id="chatBox"></div>
    <input id="chatInput" placeholder="Ask the AI analyst...">
    <button onclick="sendChat()">Send</button>
  </div>

</div>

<script>

/* LOGIN */
function login(){
  const u=document.getElementById("username").value;
  const p=document.getElementById("password").value;

  if(u==="hasini.p77" && p==="Hasini9!"){
    document.getElementById("loginScreen").style.display="none";
  } else {
    alert("ACCESS DENIED");
  }
}

/* LOGOUT */
function logout(){
  document.getElementById("loginScreen").style.display="flex";
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* CHATBOT (kept simple + working) */
function sendChat(){
  const input=document.getElementById("chatInput");
  const chat=document.getElementById("chatBox");
  const msg=input.value.toLowerCase();
  if(!msg) return;

  let res="AI SOC Analyst recommends continued monitoring.";

  if(msg.includes("phishing")) res="Phishing attack detected pattern analysis suggests email filtering.";
  if(msg.includes("password")) res="Use MFA and strong passwords (12+ chars).";
  if(msg.includes("incident")) res="Isolate system and review logs.";

  chat.innerHTML += `<div class="user">You: ${msg}</div><div class="bot">AI: ${res}</div>`;
  input.value="";
}

</script>

</body>
</html>

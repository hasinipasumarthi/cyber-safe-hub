<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe Hub Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: #0b1220;
      color: #e5e7eb;
      transition: 0.3s;
    }

    header {
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at top, #1e3a8a, #0b1220);
      position: relative;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
    }

    .toggle-btn {
      position: absolute;
      right: 20px;
      top: 20px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #38bdf8;
      color: black;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #1f2937;
      transition: 0.3s;
    }

    .card h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #0f172a;
      color: white;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #0ea5e9;
    }

    .result {
      margin-top: 10px;
      font-weight: bold;
    }

    #logPanel {
      height: 200px;
      overflow-y: auto;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 13px;
    }

    /* ========================= */
    /* TERMINAL MODE */
    /* ========================= */

    body.terminal {
      background: black;
      color: #00ff88;
    }

    body.terminal header {
      background: black;
    }

    body.terminal h1 {
      color: #00ff88;
    }

    body.terminal .card {
      background: black;
      border: 1px solid #00ff88;
    }

    body.terminal .card h2 {
      color: #00ff88;
    }

    body.terminal input {
      background: black;
      border: 1px solid #00ff88;
      color: #00ff88;
    }

    body.terminal button {
      background: black;
      border: 1px solid #00ff88;
      color: #00ff88;
    }

    body.terminal button:hover {
      background: #00ff88;
      color: black;
    }

    body.terminal #logPanel {
      background: black;
      border: 1px solid #00ff88;
      color: #00ff88;
    }

  </style>
</head>

<body>

<header>
  <h1>🔐 CyberSafe Hub Pro</h1>
  <button class="toggle-btn" onclick="toggleTerminal()">Terminal Mode</button>
</header>

<div class="container">

  <div class="card">
    <h2>🔑 Password Checker</h2>
    <input type="text" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Analyze</button>
    <div class="result" id="pwResult"></div>
  </div>

  <div class="card">
    <h2>🎣 Phishing Checker</h2>
    <input type="text" id="emailText" placeholder="Paste email text">
    <button onclick="checkPhishing()">Scan</button>
    <div class="result" id="phishResult"></div>
  </div>

  <div class="card">
    <h2>📊 Security Score</h2>
    <button onclick="calculateScore()">Calculate Score</button>
    <div class="result" id="scoreResult"></div>
  </div>

  <div class="card">
    <h2>📋 Incident Log</h2>
    <div id="logPanel"></div>
  </div>

</div>

<script>

function addLog(message, type="info") {
  const log = document.getElementById("logPanel");
  const time = new Date().toLocaleTimeString();

  const entry = document.createElement("div");
  entry.textContent = `[${time}] ${message}`;
  log.prepend(entry);
}

/* TERMINAL TOGGLE */
function toggleTerminal() {
  document.body.classList.toggle("terminal");
  addLog("UI mode switched (terminal toggle)");
}

/* PASSWORD */
function checkPassword() {
  const pw = document.getElementById("password").value;
  const out = document.getElementById("pwResult");

  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  if (!pw) return;

  if (score <= 1) {
    out.textContent = "Weak ❌";
    addLog("Weak password detected");
  } else if (score <= 3) {
    out.textContent = "Medium ⚠️";
    addLog("Medium password entered");
  } else {
    out.textContent = "Strong ✅";
    addLog("Strong password created");
  }
}

/* PHISHING */
function checkPhishing() {
  const text = document.getElementById("emailText").value.toLowerCase();
  const out = document.getElementById("phishResult");

  let score = 0;
  if (text.includes("urgent")) score++;
  if (text.includes("password")) score++;
  if (text.includes("click here")) score++;
  if (text.includes("verify")) score++;

  if (!text) return;

  if (score >= 2) {
    out.textContent = "⚠️ Phishing Likely";
    addLog("Phishing email detected");
  } else {
    out.textContent = "✔ Safe";
    addLog("Email scanned safe");
  }
}

/* SCORE */
function calculateScore() {
  const pw = document.getElementById("password").value;
  const email = document.getElementById("emailText")?.value?.toLowerCase() || "";

  let score = 100;

  if (!pw || pw.length < 8) score -= 30;
  if (!/[A-Z]/.test(pw)) score -= 10;
  if (!/[0-9]/.test(pw)) score -= 10;
  if (!/[^A-Za-z0-9]/.test(pw)) score -= 10;

  if (email.includes("urgent")) score -= 20;
  if (email.includes("click here")) score -= 20;

  let msg = `Security Score: ${score}`;

  if (score >= 80) {
    msg += " (Secure)";
  } else if (score >= 50) {
    msg += " (Medium Risk)";
  } else {
    msg += " (High Risk)";
  }

  document.getElementById("scoreResult").textContent = msg;
  addLog(`Security score calculated: ${score}`);
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Attack Map</title>

<style>

body{
  margin:0;
  background:#05010a;
  color:#ff4da6;
  font-family:Arial;
}

header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #3b0a2a;
}

.map{
  position:relative;
  height:90vh;
  background:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");
  background-size:cover;
  filter:brightness(0.4);
}

/* attack nodes */
.dot{
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(2);}
  100%{transform:scale(1);}
}

/* positions */
.us{top:40%;left:20%;}
.eu{top:35%;left:50%;}
.asia{top:45%;left:75%;}
.ru{top:25%;left:60%;}

</style>
</head>

<body>

<header>
  <h1>🌍 Global Cyber Attack Map</h1>
</header>

<div class="map">
  <div class="dot us"></div>
  <div class="dot eu"></div>
  <div class="dot asia"></div>
  <div class="dot ru"></div>
</div>

</body>
</html>

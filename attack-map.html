<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Global Attack Map</title>

<style>

body{
  margin:0;
  background:#05010a;
  color:#ff4da6;
  font-family:Arial;
}

header{
  padding:20px;
  text-align:center;
}

/* BACK BUTTON */
button{
  position:absolute;
  top:20px;
  left:20px;
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #ff4da6;
  background:#1a0010;
  color:#ff4da6;
  cursor:pointer;
}

/* MAP */
.map{
  height:90vh;
  background:url("https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg");
  background-size:cover;
  filter:brightness(0.4);
}

.dot{
  position:absolute;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(2);opacity:0.5;}
  100%{transform:scale(1);}
}

</style>
</head>

<body>

<button onclick="window.location.href='index.html'">
⬅ Back to Dashboard
</button>

<header>
<h1>🌍 Global Cyber Attack Map</h1>
</header>

<div class="map"></div>

</body>
</html>
